<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tessera — issues &amp; docs, one weave</title>
  <meta name="description" content="A local-first workspace that blends an issue tracker with a docs tool. Plan in tiles, write in flow." />
  <meta name="theme-color" content="#0C0F16" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#F1F2F6" media="(prefers-color-scheme: light)" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script>
    // Apply stored theme before first paint to avoid a flash.
    try {
      var t = JSON.parse(localStorage.getItem('tessera.v2') || '{}');
      var pref = (t.settings && t.settings.theme) || 'dark';
      if (pref === 'system') {
        pref = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.dataset.theme = pref;
    } catch (e) { /* default stays dark */ }
  </script>  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/ui.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/views.css" />
  <link rel="stylesheet" href="css/editor.css" />
  <link rel="stylesheet" href="css/welcome.css" />
  <link rel="stylesheet" href="css/ai.css" />
  <link rel="stylesheet" href="css/fx.css" />
</head>
<body>
  <!-- boot splash: four tiles assemble into the tessera mark, then part.
       Pure CSS so it plays instantly; main.js removes the node after boot. -->
  <div id="boot" aria-hidden="true">
    <div class="boot-mark">
      <i></i><i></i><i></i><i class="accent"></i>
    </div>
    <span class="boot-word">tessera</span>
  </div>
  <style>
    #boot {
      position: fixed; inset: 0; z-index: 400;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      background: var(--bg, #0C0F16);
      animation: boot-away .5s ease .95s forwards;
      pointer-events: none;
    }
    [data-theme="light"] #boot { background: #F1F2F6; }
    .boot-mark { position: relative; display: grid; grid-template-columns: 22px 22px; gap: 5px; }
    /* a comet of light orbits the assembling mark while it works */
    .boot-mark::before {
      content: "";
      position: absolute; inset: -16px;
      border-radius: 50%;
      background: conic-gradient(from 0deg,
        transparent 0% 68%, color-mix(in srgb, var(--accent, #3ECF8E) 70%, transparent) 84%, transparent 98%);
      filter: blur(3px);
      animation: boot-orbit 1.2s linear infinite;
      opacity: .9;
    }
    @keyframes boot-orbit { to { rotate: 360deg; } }
    .boot-mark i {
      width: 22px; height: 22px;
      border-radius: 6px;
      background: color-mix(in srgb, var(--text, #E8EBF4) 55%, transparent);
      animation: boot-tile .7s cubic-bezier(.3,1.45,.42,1) backwards;
    }
    .boot-mark i:nth-child(1) { animation-delay: .05s; }
    .boot-mark i:nth-child(2) { animation-delay: .15s; }
    .boot-mark i:nth-child(3) { animation-delay: .25s; }
    .boot-mark i.accent {
      background: var(--grad-accent, linear-gradient(118deg, #3ECF8E, #93EBC6));
      border-radius: 11px;
      box-shadow: 0 0 24px color-mix(in srgb, var(--accent, #3ECF8E) 50%, transparent);
      animation-delay: .38s;
    }
    @keyframes boot-tile {
      from { opacity: 0; transform: translateY(18px) scale(.3) rotate(-28deg); }
    }
    .boot-word {
      font-family: var(--sans, sans-serif); font-size: 13px; font-weight: 500;
      letter-spacing: .34em; text-transform: uppercase;
      color: color-mix(in srgb, var(--text, #E8EBF4) 45%, transparent);
      animation: fade-in .5s ease backwards .5s;
    }
    @keyframes boot-away { to { opacity: 0; visibility: hidden; } }
  </style>
  <div id="app" aria-hidden="false">
    <aside id="sidebar" class="sidebar"></aside>
    <div class="main-rail">
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="overlays"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <noscript>
    <div style="max-width:34rem;margin:18vh auto;padding:0 1.5rem;font-family:sans-serif;text-align:center">
      <h1 style="font-weight:600">Tessera needs JavaScript</h1>
      <p>Everything here runs in your browser &mdash; there is no server to talk to. Enable JavaScript and reload.</p>
    </div>
  </noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
