<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tessera — issues &amp; docs, one weave</title>
  <meta name="description" content="A local-first workspace that blends an issue tracker with a docs tool. Plan in tiles, write in flow." />
  <meta name="theme-color" content="#0a0b11" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f7f7fb" media="(prefers-color-scheme: light)" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:opsz,wght@9..144,420;9..144,520;9..144,620&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    // Apply stored theme before first paint to avoid a flash.
    try {
      var t = JSON.parse(localStorage.getItem('tessera.v2') || '{}');
      var pref = (t.settings && t.settings.theme) || 'dark';
      if (pref === 'system') {
        pref = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.dataset.theme = pref;
    } catch (e) { /* default stays dark */ }
  </script>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/ui.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/views.css" />
  <link rel="stylesheet" href="css/editor.css" />
  <link rel="stylesheet" href="css/welcome.css" />
  <link rel="stylesheet" href="css/ai.css" />
</head>
<body>
  <div id="app" aria-hidden="false">
    <aside id="sidebar" class="sidebar"></aside>
    <div class="main-rail">
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="overlays"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <noscript>
    <div style="max-width:34rem;margin:18vh auto;padding:0 1.5rem;font-family:sans-serif;text-align:center">
      <h1 style="font-weight:600">Tessera needs JavaScript</h1>
      <p>Everything here runs in your browser &mdash; there is no server to talk to. Enable JavaScript and reload.</p>
    </div>
  </noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
